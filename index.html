<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101827">
  <title>受付 QRコードスキャナー（読み取りテスト）</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, "Noto Sans JP", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f4f6fa; color: #172033; }
    main { max-width: 520px; margin: 0 auto; padding: 28px 18px 42px; }
    h1 { font-size: 1.35rem; margin: 0 0 8px; }
    p { line-height: 1.65; }
    .muted { color: #536174; font-size: .9rem; }
    .panel { background: #fff; border: 1px solid #dfe5ef; border-radius: 14px; padding: 16px; margin-top: 18px; }
    #reader { width: 100%; overflow: hidden; border-radius: 12px; }
    #reader video { max-width: 100%; border-radius: 10px; }
    button { display: block; margin-top: 14px; width: 100%; border: 0; background: #1f5aa6; color: #fff; padding: 15px; border-radius: 10px; font-weight: 700; font-size: 1rem; cursor: pointer; }
    button:disabled { opacity: .55; cursor: default; }
    #result { padding: 12px 14px; background: #edf3fb; border-radius: 8px; font-size: 1rem; min-height: 3rem; overflow-wrap: anywhere; }
    .note { border-left: 4px solid #aebbd1; padding-left: 12px; }
  </style>
</head>
<body>
  <main>
    <h1>QRコード受付</h1>
    <p class="muted">読み取り動作確認用です。このページはGASに送信せず、受付状態も更新しません。</p>
    <section class="panel">
      <div id="reader" aria-label="QRコード読み取りカメラ"></div>
      <button id="start" type="button">カメラで読み取り開始</button>
      <p id="status" class="muted" aria-live="polite">開始ボタンを押してください。</p>
    </section>
    <section class="panel">
      <h2 style="font-size:1rem; margin-top:0">読み取り結果</h2>
      <div id="result" aria-live="polite">未読み取り</div>
    </section>
    <p class="muted note">このテストではQRコードの内容を端末上に表示するだけです。名簿・メールアドレスなどはGitHub Pagesに保存しないでください。</p>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
  <script>
    const button = document.getElementById('start');
    const status = document.getElementById('status');
    const result = document.getElementById('result');
    let scanner = null;
    let reading = false;

    button.addEventListener('click', async () => {
      if (reading) return;
      if (typeof Html5Qrcode === 'undefined') {
        status.textContent = '読み取りライブラリを読み込めませんでした。通信環境を確認してください。';
        return;
      }
      button.disabled = true;
      status.textContent = 'カメラを起動しています。アクセスの確認が出たら許可してください。';
      scanner = new Html5Qrcode('reader');
      let completed = false;
      try {
        await scanner.start(
          { facingMode: 'environment' },
          { fps: 10, qrbox: { width: 220, height: 220 } },
          async (decodedText) => {
            if (completed) return;
            completed = true;
            result.textContent = `読み取り結果：${decodedText}`;
            status.textContent = /^TP-\d{4,}$/.test(decodedText)
              ? '受付IDの形式を確認しました（まだ送信していません）。'
              : '読み取り成功（受付IDとは異なる形式です）。';
            try { await scanner.stop(); } catch (error) { console.error(error); }
            try { scanner.clear(); } catch (error) { console.error(error); }
            reading = false;
            button.textContent = '次のQRコードを読み取る';
            button.disabled = false;
          },
          () => { /* 読み取れないフレームは無視 */ }
        );
        reading = true;
        if (!completed) status.textContent = 'QRコードをカメラに向けてください。';
      } catch (error) {
        console.error(error);
        reading = false;
        button.disabled = false;
        status.textContent = 'カメラを起動できませんでした。Chromeのカメラ権限を確認してください。';
      }
    });
  </script>
</body>
</html>
